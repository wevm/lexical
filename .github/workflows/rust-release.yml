name: Rust Release

# Releases the Rust port (the lexical-ui crate in rust/), versioned with
# Changesets (rust/.changeset/README.md), as swift-release.yml releases the
# Swift port. On each push to main:
# - With pending changesets in rust/.changeset, opens or updates the
#   "chore(rust): version packages" pull request, which runs
#   rust/scripts/version-packages.sh (bumps the version in
#   rust/lexical-ui/Cargo.toml and the lockfiles, adds the version's
#   section to rust/CHANGELOG.md), and starts the Rust workflow on it: a pull
#   request opened with GITHUB_TOKEN triggers none.
# - Otherwise, if lexical-ui's version isn't released yet:
#   - publishes rust/ to the mirror (wevm/lexical-rust) and tags the version
#     there, so the crate's source has a repository of its own, with the
#     workspace's Cargo.toml at its root.
#   - creates a GitHub release on the mirror from the version's section of
#     rust/CHANGELOG.md.
#   - publishes the crate to crates.io with trusted publishing (a
#     short-lived token from rust-lang/crates-io-auth-action, through
#     GitHub's OIDC; no stored secret). crates.io can't create a crate that
#     way, so tmm publishes the first version by hand and then adds this
#     workflow as the crate's trusted publisher (rust/DESIGN.md, Releases);
#     until the crate exists the step is skipped with a notice.
# The rust-release environment only limits deployments to main; no one
# approves them, so merging the version pull request is the release. Each
# step is skipped when its release already exists, so a failed run can be
# rerun.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-release
  cancel-in-progress: false

jobs:
  version:
    name: Version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # To start CI on the version branch.
    outputs:
      has-changesets: ${{ steps.version.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: rust-release/version
        run: |
          set -euo pipefail
          pending="$(find rust/.changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l)"
          if [ "$pending" -eq 0 ]; then
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has-changesets=true" >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          rust/scripts/version-packages.sh
          version="$(sed -nE '/^\[package\]/,/^\[/ s/^version = "(.*)"$/\1/p' rust/lexical-ui/Cargo.toml)"
          git add -A rust
          git commit -q -m "chore(rust): version packages ($version)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          {
            echo "Merging this releases lexical-ui **$version**: the Rust Release workflow then publishes the mirror, the tag, the GitHub release and the crate."
            echo
            awk -v v="## $version" '$0 == v {f = 1; next} /^## / {f = 0} f' rust/CHANGELOG.md
          } > "$RUNNER_TEMP/body.md"
          title="chore(rust): version packages ($version)"
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
          gh workflow run rust.yml --ref "$BRANCH"

  plan:
    name: Plan release
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.has-changesets == 'false'
    outputs:
      version: ${{ steps.plan.outputs.version }}
      mirror: ${{ steps.plan.outputs.mirror }}
      release: ${{ steps.plan.outputs.release }}
      crate: ${{ steps.plan.outputs.crate }}
      first: ${{ steps.plan.outputs.first }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: rust/lexical-ui/Cargo.toml
          sparse-checkout-cone-mode: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CRATE: lexical-ui
        run: |
          set -euo pipefail
          version="$(sed -nE '/^\[package\]/,/^\[/ s/^version = "(.*)"$/\1/p' rust/lexical-ui/Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "0.0.0" ]; then
            echo "mirror=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "crate=false" >> "$GITHUB_OUTPUT"
            echo "first=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/wevm/lexical-rust)"
          if [ "$status" != 200 ]; then
            echo "::error::The mirror wevm/lexical-rust isn't there (HTTP $status). tmm creates it and pushes the first split by hand (rust/DESIGN.md, Releases); then rerun this workflow."
            exit 1
          fi
          if git ls-remote --exit-code --tags https://github.com/wevm/lexical-rust.git "refs/tags/$version" >/dev/null; then
            echo "mirror=false" >> "$GITHUB_OUTPUT"
          else
            echo "mirror=true" >> "$GITHUB_OUTPUT"
          fi
          status="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/wevm/lexical-rust/releases/tags/$version")"
          case "$status" in
            200) echo "release=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "release=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Looking up the $version release returned HTTP $status." >&2; exit 1 ;;
          esac
          # The crate's versions, from crates.io's sparse index (one JSON
          # object per version; 404 until the first publish, which `first`
          # marks).
          status="$(curl -s -o "$RUNNER_TEMP/index" -w '%{http_code}' \
            "https://index.crates.io/${CRATE:0:2}/${CRATE:2:2}/$CRATE")"
          case "$status" in
            200)
              if jq -e --arg v "$version" 'select(.vers == $v)' "$RUNNER_TEMP/index" >/dev/null; then
                echo "crate=false" >> "$GITHUB_OUTPUT"
              else
                echo "crate=true" >> "$GITHUB_OUTPUT"
              fi
              echo "first=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "crate=true" >> "$GITHUB_OUTPUT"
              echo "first=true" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "Looking up $CRATE in the crates.io index returned HTTP $status." >&2; exit 1 ;;
          esac

  mirror:
    name: Publish mirror
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.mirror == 'true' || needs.plan.outputs.release == 'true'
    environment: rust-release
    permissions:
      contents: read
      id-token: write # For the github-sts token exchange.
    env:
      MIRROR_REPO: wevm/lexical-rust
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # Short-lived token for the mirror, authorized by
      # rust/.github/sts/mirror.sts.yaml (published to the mirror's main).
      - name: Fetch mirror token
        id: sts
        uses: wevm/actions/.github/actions/github-sts@5ba8f9b728c490f855f7bad3d0ba6dc9c1ab32ff # main
        with:
          scope: wevm/lexical-rust
          policy: mirror
          ttl: 5m
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Split and push
        if: needs.plan.outputs.mirror == 'true'
        env:
          MIRROR_TOKEN: ${{ steps.sts.outputs.token }}
        run: |
          set -euo pipefail
          git subtree split --prefix=rust -b mirror
          remote="https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git"
          git push "$remote" mirror:main
          git tag "$VERSION" mirror
          git push "$remote" "refs/tags/$VERSION"
      # The version's changelog section. Its commit hashes are wevm/lexical's,
      # which GitHub doesn't link from the mirror, so they become links.
      - name: Create release
        if: needs.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
        run: |
          set -euo pipefail
          awk -v v="## $VERSION" '$0 == v {f = 1; next} /^## / {f = 0} f' rust/CHANGELOG.md |
            sed -E 's|^- ([0-9a-f]{7,40}):|- [`\1`](https://github.com/wevm/lexical/commit/\1):|' \
            >"$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "No section for $VERSION in rust/CHANGELOG.md." >&2
            exit 1
          fi
          gh release create "$VERSION" -R "$MIRROR_REPO" --verify-tag \
            --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  # After the mirror, so crates.io never has a version the mirror lacks.
  # The crate's trusted publisher on crates.io names this workflow file and
  # the rust-release environment; renaming either breaks publishing until the
  # crates.io configuration matches.
  crate:
    name: Publish crate
    runs-on: ubuntu-latest
    needs: [plan, mirror]
    if: >-
      always() && needs.plan.outputs.crate == 'true' &&
      (needs.mirror.result == 'success' || needs.mirror.result == 'skipped')
    environment: rust-release
    permissions:
      contents: read
      id-token: write # For crates.io's trusted publishing token exchange.
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        working-directory: rust
    steps:
      # First, so the steps' working directory (rust/) exists.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Wait for the first publish
        if: needs.plan.outputs.first == 'true'
        run: echo "::notice::lexical-ui isn't on crates.io yet. Trusted publishing can't create a crate, so tmm publishes $VERSION by hand and adds this workflow as its trusted publisher (rust/DESIGN.md, Releases)."
      # rustup is preinstalled; rust-toolchain.toml picks the version.
      - name: Install the toolchain
        if: needs.plan.outputs.first == 'false'
        run: rustup show active-toolchain || rustup toolchain install
      # A token valid for 30 minutes, revoked when the job ends. Fails until
      # the crate's trusted publisher names wevm/lexical, rust-release.yml
      # and the rust-release environment.
      - name: Authenticate to crates.io
        if: needs.plan.outputs.first == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        if: needs.plan.outputs.first == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p lexical-ui --locked
