name: Rust

# CI for the Rust port in rust/ (the lexical-ui crate) and the
# conformance runner that replays packages/lexical-conformance's vectors.
# Runs on every change because the vectors can change with any JS change;
# swift.yml checks that the checked-in vectors match the JS behavior.

on:
  # The release workflow starts this on its version pull request's branch.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # rustup is preinstalled; rust-toolchain.toml picks the version.
      - name: Install the toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      # The report: every vector file, how many cases match JS, match under a
      # documented exception, wait on a package not ported yet, or fail, and
      # which files aren't replayed yet.
      - name: Conformance
        run: cargo run --locked --release -p lexical-conformance -- --summary "$GITHUB_STEP_SUMMARY"
      # The parity ledger (rust/parity and the `// upstream:` markers, with
      # swift/parity): fails when a marker or a skip names an unknown test,
      # or an enforced package has a test neither ported nor skipped.
      # swift.yml runs it too, with `--fresh`, which reruns the upstream
      # tests to check that swift/parity/upstream-tests.json is current.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Parity ledger
        run: node ../packages/lexical-conformance/scripts/ledger.mjs --check
      # Broken intra-doc links and other rustdoc warnings fail.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      # Packages the crate as crates.io would get it and builds the package
      # with every feature, without uploading: the manifest's metadata, the
      # files it ships and that it builds outside the workspace
      # (rust-release.yml publishes it).
      - name: Package
        run: cargo publish --dry-run -p lexical-ui --locked --all-features
      # The crate has no third-party dependencies in its default build, nor
      # with every feature but `autolink` (rust/DESIGN.md): any normal or
      # build dependency fails. `autolink` brings in `regex` and its own
      # crates, and nothing else.
      - name: No dependencies
        run: |
          features="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "lexical-ui") | .features | keys - ["autolink"] | join(",")')"
          for args in "" "--features $features"; do
            deps="$(cargo tree -p lexical-ui -e normal,build --prefix none --locked $args | grep -v '^lexical-ui v' || true)"
            if [ -n "$deps" ]; then
              echo "lexical-ui ${args:-(default features)} has third-party dependencies:" >&2
              echo "$deps" >&2
              echo "Put them behind an opt-in feature, or drop them." >&2
              exit 1
            fi
          done
          deps="$(cargo tree -p lexical-ui -e normal,build --prefix none --locked --features autolink | grep -v '^lexical-ui v' | sed -E 's/ v.*//' | sort -u)"
          if [ "$deps" != "$(printf 'regex\nregex-automata\nregex-syntax')" ]; then
            echo "lexical-ui --features autolink should depend on regex alone:" >&2
            echo "$deps" >&2
            exit 1
          fi
      # The library builds on the oldest Rust its manifest names.
      - name: Minimum Rust version
        run: |
          msrv="$(sed -nE 's/^rust-version = "(.*)"/\1/p' Cargo.toml)"
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check -p lexical-ui --all-features --locked
