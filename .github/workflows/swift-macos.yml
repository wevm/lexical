name: Swift (macOS)

# The Swift port on macOS and the iOS Simulator, with the Xcode 27 toolchain.
# The package supports iOS 26 and macOS 26, so the oldest runtimes run too.
# Path-filtered because macOS runners are slow to start.

on:
  push:
    branches: [main]
    paths:
      - 'swift/**'
      - 'packages/lexical-conformance/**'
      - '.github/workflows/swift-macos.yml'
  pull_request:
    paths:
      - 'swift/**'
      - 'packages/lexical-conformance/**'
      - '.github/workflows/swift-macos.yml'

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macos:
    name: Swift (macOS)
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: swift --version
      - name: Build and test (macOS)
        run: swift test

  ios:
    name: Swift (iOS ${{ matrix.ios }} Simulator)
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The newest runtime and the deployment target's.
        ios: ['27', '26']
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Test (iOS ${{ matrix.ios }} Simulator)
        env:
          IOS_MAJOR: ${{ matrix.ios }}
        run: |
          # The newest installed runtime of this major version, downloading
          # one when the image has none (the xcode-27 image may carry only
          # iOS 27), and an iPhone on it, created when there is none.
          pick_runtime() {
            xcrun simctl list runtimes available -j | python3 -c '
          import json, os, sys
          major = os.environ["IOS_MAJOR"]
          found = [r for r in json.load(sys.stdin)["runtimes"]
                   if r["platform"] == "iOS" and r["version"].split(".")[0] == major]
          if found:
              print(max(found, key=lambda r: [int(x) for x in r["version"].split(".")])["identifier"])
          '
          }
          runtime="$(pick_runtime)"
          if [ -z "$runtime" ]; then
            xcodebuild -downloadPlatform iOS -buildVersion "$IOS_MAJOR" ||
              { echo "::error::No iOS $IOS_MAJOR simulator runtime could be installed"; exit 1; }
            runtime="$(pick_runtime)"
          fi
          [ -n "$runtime" ] || { echo "::error::No iOS $IOS_MAJOR simulator runtime"; exit 1; }
          echo "Runtime: $runtime"
          device="$(xcrun simctl list devices available -j | RUNTIME="$runtime" python3 -c '
          import json, os, sys
          phones = [d for d in json.load(sys.stdin)["devices"].get(os.environ["RUNTIME"], [])
                    if d["name"].startswith("iPhone")]
          print(phones[0]["udid"] if phones else "")
          ')"
          if [ -z "$device" ]; then
            type="$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          print([t["identifier"] for t in json.load(sys.stdin)["devicetypes"] if t["name"].startswith("iPhone")][-1])
          ')"
            device="$(xcrun simctl create "iPhone (iOS $IOS_MAJOR)" "$type" "$runtime")"
          fi
          # The macro expansion tests link swift-syntax for the host; they run
          # in the macOS job and cannot load in the simulator.
          xcodebuild test -scheme Lexical-Package -destination "id=$device" -skipPackagePluginValidation -skipMacroValidation \
            -skip-testing:LexicalMacrosTests
