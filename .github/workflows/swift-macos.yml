name: Swift (macOS)

# The Swift port on macOS and the iOS Simulator, with the Xcode 27 toolchain.
# The package supports iOS 26 and macOS 26, so the oldest runtimes run too.
# Path-filtered because macOS runners are slow to start.

on:
  # The release workflow starts these on its version pull request's branch.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'swift/**'
      - 'packages/lexical-conformance/**'
      - '.github/workflows/swift-macos.yml'
  pull_request:
    paths:
      - 'swift/**'
      - 'packages/lexical-conformance/**'
      - '.github/workflows/swift-macos.yml'

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macos:
    if: false
    name: Swift (macOS)
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: swift --version
      - name: Build and test (macOS)
        run: swift test
      # The view modules' API exists only on Apple platforms (Linux checks the rest).
      - name: API breaks since the last release
        run: scripts/api-breaks.sh

  ios:
    name: Swift (iOS ${{ matrix.ios }} Simulator) ${{ matrix.copy }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The newest runtime and the deployment target's. A runtime the image
        # lacks is downloaded, which takes a full version (the xcode-27 image
        # has only iOS 27 runtimes).
        ios: ['26.5']
        copy: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Test (iOS ${{ matrix.ios }} Simulator)
        env:
          IOS_VERSION: ${{ matrix.ios }}
        run: |
          # The newest installed runtime of this version (or of this major
          # version), downloading it when the image has none, and an iPhone
          # on it, created when there is none.
          pick_runtime() {
            xcrun simctl list runtimes available -j | python3 -c '
          import json, os, sys
          want = os.environ["IOS_VERSION"].split(".")
          found = [r for r in json.load(sys.stdin)["runtimes"]
                   if r["platform"] == "iOS" and r["version"].split(".")[:len(want)] == want]
          if found:
              print(max(found, key=lambda r: [int(x) for x in r["version"].split(".")])["identifier"])
          '
          }
          runtime="$(pick_runtime)"
          if [ -z "$runtime" ]; then
            xcodebuild -downloadPlatform iOS -buildVersion "$IOS_VERSION" ||
              { echo "::error::No iOS $IOS_VERSION simulator runtime could be installed"; exit 1; }
            runtime="$(pick_runtime)"
          fi
          [ -n "$runtime" ] || { echo "::error::No iOS $IOS_VERSION simulator runtime"; exit 1; }
          echo "Runtime: $runtime"
          device="$(xcrun simctl list devices available -j | RUNTIME="$runtime" python3 -c '
          import json, os, sys
          phones = [d for d in json.load(sys.stdin)["devices"].get(os.environ["RUNTIME"], [])
                    if d["name"].startswith("iPhone")]
          print(phones[0]["udid"] if phones else "")
          ')"
          if [ -z "$device" ]; then
            type="$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          print([t["identifier"] for t in json.load(sys.stdin)["devicetypes"] if t["name"].startswith("iPhone")][-1])
          ')"
            device="$(xcrun simctl create "iPhone (iOS $IOS_VERSION)" "$type" "$runtime")"
          fi
          # The macro expansion tests link swift-syntax for the host; they run
          # in the macOS job and cannot load in the simulator.
          xcodebuild build-for-testing -scheme Lexical-Package -destination "id=$device" -skipPackagePluginValidation -skipMacroValidation -quiet
          for i in 1 2 3 4 5 6; do
            xcodebuild test-without-building -scheme Lexical-Package -destination "id=$device" -skipPackagePluginValidation -skipMacroValidation \
              -only-testing:LexicalUIKitTests > "$RUNNER_TEMP/uikit-$i.log" 2>&1
            echo "iteration $i: exit $?"
            grep -E "HANDLES-|CandidateGeneration|recorded a known issue|recorded an issue|Unable to boot|Unable to find a device" "$RUNNER_TEMP/uikit-$i.log" | cut -c1-30000 || true
          done
