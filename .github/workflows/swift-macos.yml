name: Swift (macOS)

# The Swift port on macOS and the iOS Simulator, with the Xcode 27 toolchain
# (Swift 6.4, the oldest the manifest supports). The package supports iOS 26
# and macOS 26, so the oldest runtimes run too.
# macOS runners are slow to start and scarce, so pull requests run less:
# - only changes to swift/ outside the playground and Markdown start a run
#   (Linux replays the conformance vectors on every change);
# - the iOS 26.5 Simulator runs only on main and nightly, where a failure is
#   fixed forward and blocks the next release (swift/AGENTS.md);
# - the macOS API-break check runs only when the view modules change.

on:
  workflow_dispatch:
  schedule:
    - cron: '7 4 * * *'
  push:
    branches: [main]
    paths:
      - 'swift/**'
      - 'packages/lexical-conformance/**'
      - '.github/workflows/swift-macos.yml'
  pull_request:
    paths:
      - 'swift/**'
      - '!swift/apps/lexical-playground-swift/**'
      - '!**/*.md'
      - '.github/workflows/swift-macos.yml'

# A newer commit cancels the run of an older one on a pull request. On main a
# started run finishes and only the newest waiting one is kept: runs wait
# hours for a runner, so cancelling there left main with no finished run.
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macos:
    name: Swift (macOS)
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: swift
    steps:
      # Two commits on a pull request: its merge commit and the base, so the
      # API-break step can see what the pull request changes.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - run: swift --version
      # The oldest swift-syntax the manifest accepts (Swift 6.4 would resolve
      # 604, which Linux and the iOS jobs test), so a change that needs a
      # newer one fails here. Pinning one dependency needs a resolution to pin
      # it in.
      - name: Resolve swift-syntax 603.0.0
        run: swift package resolve && swift package resolve swift-syntax --version 603.0.0
      - name: Build and test (macOS)
        run: swift test
      # Only the view modules' API is Apple-only (Linux checks the rest), so a
      # pull request that changes none of them skips the check here.
      - name: Changes to the view modules
        id: views
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only HEAD^1 HEAD -- \
            Sources/LexicalAppKit Sources/LexicalUIKit Sources/LexicalSwiftUI \
            Package.swift scripts/api-breaks.sh)"
          echo "${changed:-None.}"
          echo "changed=$([ -n "$changed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: API breaks since the last release
        if: github.event_name != 'pull_request' || steps.views.outputs.changed == 'true'
        run: scripts/api-breaks.sh

  ios:
    name: Swift (iOS ${{ matrix.ios }} Simulator)
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The newest runtime and the deployment target's. A runtime the image
        # lacks is downloaded, which takes a full version (the xcode-27 image
        # has only iOS 27 runtimes). Pull requests run only the newest.
        ios: ${{ fromJSON(github.event_name == 'pull_request' && '["27"]' || '["27", "26.5"]') }}
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Test (iOS ${{ matrix.ios }} Simulator)
        env:
          IOS_VERSION: ${{ matrix.ios }}
        run: |
          set -o pipefail
          # The newest installed runtime of this version (or of this major
          # version), downloading it when the image has none, and an iPhone
          # on it, created when there is none. A runtime made for one device
          # doesn't count: the image's iOS-27-2-iPhone19-4 and iOS-27-1 run
          # only the iPhone Duo, whose wide screen the tests aren't written for.
          pick_runtime() {
            xcrun simctl list runtimes available -j | python3 -c '
          import json, os, sys
          want = os.environ["IOS_VERSION"].split(".")
          found = [r for r in json.load(sys.stdin)["runtimes"]
                   if r["platform"] == "iOS" and r["version"].split(".")[:len(want)] == want
                   and len(r["supportedDeviceTypes"]) > 1]
          if found:
              print(max(found, key=lambda r: [int(x) for x in r["version"].split(".")])["identifier"])
          '
          }
          runtime="$(pick_runtime)"
          if [ -z "$runtime" ]; then
            xcodebuild -downloadPlatform iOS -buildVersion "$IOS_VERSION" ||
              { echo "::error::No iOS $IOS_VERSION simulator runtime could be installed"; exit 1; }
            runtime="$(pick_runtime)"
          fi
          [ -n "$runtime" ] || { echo "::error::No iOS $IOS_VERSION simulator runtime"; exit 1; }
          echo "Runtime: $runtime"
          device="$(xcrun simctl list devices available -j | RUNTIME="$runtime" python3 -c '
          import json, os, sys
          phones = [d for d in json.load(sys.stdin)["devices"].get(os.environ["RUNTIME"], [])
                    if d["name"].startswith("iPhone")]
          print(phones[0]["udid"] if phones else "")
          ')"
          if [ -z "$device" ]; then
            type="$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          print([t["identifier"] for t in json.load(sys.stdin)["devicetypes"] if t["name"].startswith("iPhone")][-1])
          ')"
            device="$(xcrun simctl create "iPhone (iOS $IOS_VERSION)" "$type" "$runtime")"
          fi
          # Only the test targets with Apple-specific code: the iOS view and
          # the core (which has iOS-only input handling), with the TextKit
          # layer and accessibility they sit on. macOS and Linux run the rest.
          # The macro expansion tests link swift-syntax for the host and
          # cannot load in the simulator.
          # xcodebuild boots the simulator after the build: one booted
          # during the build slows it about twofold on these runners.
          # A freshly installed runtime sometimes fails to boot or to launch
          # the tests ("cannot determine the runtime bundle"), so a run the
          # simulator broke, with no test recording an issue, runs again on a
          # shut-down simulator, up to three times; the build is incremental.
          for attempt in 1 2 3; do
            status=0
            xcodebuild test -scheme Lexical-Package -destination "id=$device" \
              -skipPackagePluginValidation -skipMacroValidation \
              -only-testing:LexicalUIKitTests -only-testing:LexicalTests \
              -only-testing:LexicalTextKitTests -only-testing:LexicalA11yTests \
              2>&1 | tee "$RUNNER_TEMP/test.log" || status=$?
            [ "$status" -eq 0 ] && exit 0
            if [ "$attempt" -eq 3 ] ||
              grep -qE "recorded an issue|' failed \(" "$RUNNER_TEMP/test.log" ||
              ! grep -qE "Unable to boot device|runtime bundle|iOS Simulator \(null\)|Failed to prepare device|Early unexpected exit|Failed to install or launch the test runner" "$RUNNER_TEMP/test.log"; then
              exit "$status"
            fi
            echo "::warning::The simulator failed the test run (attempt $attempt); running it again"
            xcrun simctl shutdown "$device" || true
            sleep 10
          done
