name: Swift playground

# Nightly run of the Swift playground's tests (swift/apps/lexical-playground-
# swift): its UI tests and unit tests on the iOS 27 and 26.5 Simulators (the
# newest runtime and the deployment target's). Not gating: it
# runs on a schedule, never on pull requests, so the macOS runners are not
# loaded for every change. A failure keeps the result bundle, with the
# screenshots, the screen recording and the element tree, as an artifact.

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Swift playground (iOS ${{ matrix.ios }} Simulator)
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The newest runtime and the deployment target's, as in
        # swift-macos.yml. A runtime the image lacks is downloaded.
        ios: ['27', '26.5']
    defaults:
      run:
        working-directory: swift/apps/lexical-playground-swift
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Generate the Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Test (iOS ${{ matrix.ios }} Simulator)
        env:
          IOS_VERSION: ${{ matrix.ios }}
        run: |
          # The newest installed runtime of this version (or of this major
          # version), downloading it when the image has none, and an iPhone
          # on it, created when there is none.
          pick_runtime() {
            xcrun simctl list runtimes available -j | python3 -c '
          import json, os, sys
          want = os.environ["IOS_VERSION"].split(".")
          found = [r for r in json.load(sys.stdin)["runtimes"]
                   if r["platform"] == "iOS" and r["version"].split(".")[:len(want)] == want]
          if found:
              print(max(found, key=lambda r: [int(x) for x in r["version"].split(".")])["identifier"])
          '
          }
          runtime="$(pick_runtime)"
          if [ -z "$runtime" ]; then
            xcodebuild -downloadPlatform iOS -buildVersion "$IOS_VERSION" ||
              { echo "::error::No iOS $IOS_VERSION simulator runtime could be installed"; exit 1; }
            runtime="$(pick_runtime)"
          fi
          [ -n "$runtime" ] || { echo "::error::No iOS $IOS_VERSION simulator runtime"; exit 1; }
          device="$(xcrun simctl list devices available -j | RUNTIME="$runtime" python3 -c '
          import json, os, sys
          phones = [d for d in json.load(sys.stdin)["devices"].get(os.environ["RUNTIME"], [])
                    if d["name"].startswith("iPhone")]
          print(phones[0]["udid"] if phones else "")
          ')"
          if [ -z "$device" ]; then
            type="$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          print([t["identifier"] for t in json.load(sys.stdin)["devicetypes"] if t["name"].startswith("iPhone")][-1])
          ')"
            device="$(xcrun simctl create "iPhone (iOS $IOS_VERSION)" "$type" "$runtime")"
          fi
          echo "Runtime: $runtime, device: $device"
          # One simulator at a time: the UI tests type into the same app.
          xcodebuild test -project LexicalPlayground.xcodeproj -scheme LexicalPlayground \
            -destination "id=$device" -parallel-testing-enabled NO \
            -skipMacroValidation -skipPackagePluginValidation \
            -resultBundlePath "$RUNNER_TEMP/LexicalPlayground.xcresult"
      - name: Keep the result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: LexicalPlayground-ios-${{ matrix.ios }}-xcresult
          path: ${{ runner.temp }}/LexicalPlayground.xcresult
          retention-days: 14
