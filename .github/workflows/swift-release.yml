name: Swift Release

# Releases the Swift port, versioned with Changesets (swift/.changeset/README.md).
# On each push to main:
# - With pending changesets in swift/.changeset, opens or updates the
#   "chore(swift): version packages" pull request, which runs
#   swift/scripts/version-packages.sh (bumps swift/VERSION, adds the
#   version's section to swift/CHANGELOG.md), and starts the Swift
#   workflow on it: a pull request opened with GITHUB_TOKEN triggers none.
#   It doesn't start Swift (macOS): the branch differs from main only in
#   VERSION, CHANGELOG.md and the changesets, so main's Swift (macOS) run at
#   the branch's base is the check for it (swift/AGENTS.md, Releases).
# - Otherwise, if swift/VERSION names a version that isn't released yet:
#   - publishes swift/ to the SwiftPM mirror (wevm/lexical-swift) and tags
#     the version there. SwiftPM needs Package.swift at a repository root and
#     clones whole repositories, so consumers install from the mirror.
#   - creates a GitHub release on the mirror from the version's section of
#     swift/CHANGELOG.md.
# The swift-release environment only limits deployments to main; no one
# approves them, so merging the version pull request is the release. Each
# step is skipped when its release already exists, so a failed run can be
# rerun.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-release
  cancel-in-progress: false

jobs:
  version:
    name: Version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # To start CI on the version branch.
    outputs:
      has-changesets: ${{ steps.version.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: swift-release/version
        run: |
          set -euo pipefail
          pending="$(find swift/.changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l)"
          if [ "$pending" -eq 0 ]; then
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has-changesets=true" >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          swift/scripts/version-packages.sh
          version="$(tr -d '[:space:]' < swift/VERSION)"
          git add -A swift
          git commit -q -m "chore(swift): version packages ($version)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          {
            echo "Merging this releases lexical-swift **$version**: the Swift Release workflow then publishes the mirror, the tag and the GitHub release."
            echo
            awk -v v="## $version" '$0 == v {f = 1; next} /^## / {f = 0} f' swift/CHANGELOG.md
          } > "$RUNNER_TEMP/body.md"
          title="chore(swift): version packages ($version)"
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
          gh workflow run swift.yml --ref "$BRANCH"

  plan:
    name: Plan release
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.has-changesets == 'false'
    outputs:
      version: ${{ steps.plan.outputs.version }}
      mirror: ${{ steps.plan.outputs.mirror }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: swift/VERSION
          sparse-checkout-cone-mode: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < swift/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "0.0.0" ]; then
            echo "mirror=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags https://github.com/wevm/lexical-swift.git "refs/tags/$version" >/dev/null; then
            echo "mirror=false" >> "$GITHUB_OUTPUT"
          else
            echo "mirror=true" >> "$GITHUB_OUTPUT"
          fi
          status="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/wevm/lexical-swift/releases/tags/$version")"
          case "$status" in
            200) echo "release=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "release=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Looking up the $version release returned HTTP $status." >&2; exit 1 ;;
          esac

  mirror:
    name: Publish mirror
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.mirror == 'true' || needs.plan.outputs.release == 'true'
    environment: swift-release
    permissions:
      contents: read
      id-token: write # For the github-sts token exchange.
    env:
      MIRROR_REPO: wevm/lexical-swift
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # Short-lived token for the mirror, authorized by
      # swift/.github/sts/mirror.sts.yaml (published to the mirror's main).
      - name: Fetch mirror token
        id: sts
        uses: wevm/actions/.github/actions/github-sts@5ba8f9b728c490f855f7bad3d0ba6dc9c1ab32ff # main
        with:
          scope: wevm/lexical-swift
          policy: mirror
          ttl: 5m
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Split and push
        if: needs.plan.outputs.mirror == 'true'
        env:
          MIRROR_TOKEN: ${{ steps.sts.outputs.token }}
        run: |
          set -euo pipefail
          git subtree split --prefix=swift -b mirror
          remote="https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git"
          git push "$remote" mirror:main
          git tag "$VERSION" mirror
          git push "$remote" "refs/tags/$VERSION"
      # The version's changelog section. Its commit hashes are wevm/lexical's,
      # which GitHub doesn't link from the mirror, so they become links.
      - name: Create release
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
        run: |
          set -euo pipefail
          awk -v v="## $VERSION" '$0 == v {f = 1; next} /^## / {f = 0} f' swift/CHANGELOG.md |
            sed -E 's|^- ([0-9a-f]{7,40}):|- [`\1`](https://github.com/wevm/lexical/commit/\1):|' \
            >"$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "No section for $VERSION in swift/CHANGELOG.md." >&2
            exit 1
          fi
          gh release create "$VERSION" -R "$MIRROR_REPO" --verify-tag \
            --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
