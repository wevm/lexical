name: Swift

# CI for the Swift port in swift/ and the conformance vectors it replays
# (packages/lexical-conformance). Linux runs on every change because the
# vectors can go stale from any JS change. The Apple-only layer runs in
# swift-macos.yml.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  vectors:
    name: Conformance vectors and parity ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.24.0
      # The vectors are JS's answers, so they come from the repo's pinned Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # Fails when the checked-in vectors no longer match the JS behavior.
      - name: Check vectors are current
        run: pnpm --filter lexical-conformance run test
      # The Tier 2 scenarios are recorded in WebKit; fails when they are stale.
      - name: Install WebKit
        run: pnpm exec playwright install --with-deps webkit
      - name: Check scenarios are current
        run: pnpm --filter lexical-conformance run scenarios
      # Reruns the upstream unit tests of the in-scope packages: fails when
      # swift/parity/upstream-tests.json is stale, when a port or skip names
      # an unknown test, or when an enforced package has unported tests.
      - name: Check the parity ledger
        run: pnpm --filter lexical-conformance run check-ledger --fresh

  linux:
    name: Swift (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4.2-bookworm
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Format
        run: swift format lint --strict --recursive Sources Tests Benchmarks Package.swift
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build

  # Reported, not gating (swift/DESIGN.md, Benchmarks): the numbers go to the
  # job summary, and a slow run never fails the workflow.
  benchmarks:
    name: Benchmarks (reported)
    runs-on: ubuntu-latest
    container: swift:6.4.2-bookworm
    continue-on-error: true
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run
        run: swift run -c release LexicalBenchmarks --markdown "$GITHUB_STEP_SUMMARY"

  # Fails on a break of the public API since the mirror's newest release tag,
  # unless CHANGELOG.md lists it as breaking (swift/scripts/api-breaks.sh).
  api-breaks:
    name: Swift API breaks (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4.2-bookworm
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install python3
        run: command -v python3 || (apt-get update -q && apt-get install -yq python3)
      - name: Check
        run: scripts/api-breaks.sh
