# Lets wevm/lexical's Rust Release workflow (main, rust-release environment)
# push the subtree split of rust/ and its release tags to this mirror, and
# create the matching GitHub release.
# Lives in wevm/lexical under rust/ so each mirror push publishes it here.
subject: repo:wevm@109633172/lexical@1443802185:environment:rust-release
claim_pattern:
  ref: refs/heads/main
  workflow_ref: 'wevm/lexical/\.github/workflows/rust-release\.yml@refs/heads/main'
permissions:
  contents: write
max_ttl: 5m
