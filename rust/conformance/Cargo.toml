[package]
name = "lexical-conformance"
version.workspace = true
description = "Replays the conformance vectors that packages/lexical-conformance records from the JS packages against the Rust port."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lexical = { workspace = true, features = ["a11y", "auto-embed", "autolink", "clipboard", "code", "decorator-block", "devtools", "extension", "file", "hashtag", "history", "link", "list", "mark", "menu", "overflow", "plain-text", "rich-text", "text"] }

[lints]
workspace = true
