[package]
name = "lexical-editor"
version.workspace = true
description = "A Rust port of Lexical's model and headless packages, at parity with the JS implementation."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["lexical", "editor", "rich-text"]
categories = ["text-processing"]
# Nothing is published until tmm settles the name (rust/DESIGN.md).
publish = false

# One feature per upstream package, added as each package is ported
# (rust/DESIGN.md, "Packages and features"). The core (`lexical`) is always
# built. The default build has no third-party dependencies.
[features]
# @lexical/history. Upstream it depends on @lexical/utils, which isn't ported;
# it needs nothing from it.
history = []
# @lexical/selection.
selection = []
# @lexical/utils.
utils = ["selection"]
# @lexical/rich-text: HeadingNode and QuoteNode.
rich-text = ["selection", "utils"]
# @lexical/plain-text: registerPlainText's model command handlers.
plain-text = []
# @lexical/list: ListNode, ListItemNode, registerList and the model parts of
# registerCheckList. Upstream it also depends on @lexical/extension and
# @lexical/html, for ListExtension and the DOM import, which aren't ported.
list = ["utils"]
# @lexical/link: LinkNode, AutoLinkNode, $toggleLink and registerLink. Upstream
# it also depends on @lexical/extension and @lexical/html, for LinkExtension
# and the DOM import, which aren't ported.
link = ["utils"]
# @lexical/link's registerAutoLink and its matchers (LexicalAutoLinkExtension.ts),
# whose regular expressions need the `regex` crate: the one feature with a
# third-party dependency (rust/DESIGN.md, "Architecture").
autolink = ["link", "dep:regex"]
# @lexical/code-core: CodeNode, CodeHighlightNode, FlatStructureUtils and the
# model parts of CodeExtension and registerCodeIndentation. Upstream it also
# depends on @lexical/extension, @lexical/html and @lexical/utils, for the
# extensions, the DOM import and the arrow-key handlers, which aren't ported.
code = []
# @lexical/overflow: OverflowNode.
overflow = []
# @lexical/text: registerLexicalTextEntity, the transforms that make text
# entities (hashtags) of the text a matcher finds, and the root helpers
# ($rootTextContent, $isRootTextContentEmpty, $canShowPlaceholder,
# $findTextIntersectionFromCharacters).
text = []
# @lexical/hashtag: HashtagNode, its matcher (getHashtagMatch, without the
# `regex` crate) and registerLexicalHashtag. Upstream it also depends on
# @lexical/extension and @lexical/utils, for HashtagExtension and
# mergeRegister, which aren't ported.
hashtag = ["text"]
# @lexical/file: the .lexical document format, importFile and exportFile, with
# the app picking and saving the file.
file = []
# @lexical/devtools-core: generateContent, the tree view's text. Upstream it
# depends on @lexical/html, @lexical/link, @lexical/mark and @lexical/table;
# the link branch is built with `link` (without it no link node can exist),
# and the HTML form, mark and table nodes aren't ported.
devtools = []
# @lexical/extension's decorators: HorizontalRuleNode (a block decorator) and
# DecoratorTextNode (an inline one), and NormalizeInlineElementsExtension's
# transform. The rest of the package, the extension API, isn't ported.
extension = []

[dependencies]
# Without `perf-literal`, which would add aho-corasick and memchr.
regex = { version = "1.13", optional = true, default-features = false, features = [
    "std",
    "unicode",
    "perf-backtrack",
    "perf-cache",
    "perf-dfa",
    "perf-inline",
    "perf-onepass",
] }

[lints]
workspace = true
