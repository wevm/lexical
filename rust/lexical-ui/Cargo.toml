[package]
name = "lexical-ui"
# The released version: rust/scripts/version-packages.sh bumps it from the
# changesets in rust/.changeset (its README). Don't edit it by hand.
version = "0.1.4"
description = "A Rust port of Lexical's model and headless packages, at parity with the JS implementation."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The workspace README, which is also the mirror's (wevm/lexical-rust).
readme = "../README.md"
keywords = ["lexical", "editor", "rich-text"]
categories = ["text-processing"]
# Published to crates.io by .github/workflows/rust-release.yml (rust/DESIGN.md,
# Releases); never by hand, except tmm's first publish.

# docs.rs documents every feature, as `cargo doc --all-features` does in CI.
[package.metadata.docs.rs]
all-features = true

# One feature per upstream package, added as each package is ported
# (rust/DESIGN.md, "Packages and features"). The core (`lexical`) is always
# built. The default build has no third-party dependencies.
[features]
# @lexical/history. Upstream it depends on @lexical/utils, which isn't ported;
# it needs nothing from it.
history = []
# @lexical/selection.
selection = []
# @lexical/utils.
utils = ["selection"]
# @lexical/rich-text: HeadingNode, QuoteNode and registerRichText's model
# command handlers (its key, click, drag and drop handlers among them), with
# its copy, cut, paste and drop handlers (@lexical/clipboard), and @lexical/react's table of contents (LexicalTableOfContentsPlugin.tsx),
# whose mutation listeners hear from the core's reconciler once the editor has
# a root element.
rich-text = ["selection", "utils", "clipboard"]
# @lexical/plain-text: registerPlainText's model command handlers, with its
# copy, cut, paste and drop handlers (@lexical/clipboard) and its arrow keys
# ($moveCharacter, @lexical/selection, which `clipboard` brings). Upstream it
# also depends on @lexical/dragon and @lexical/extension, for
# PlainTextExtension's dependencies, and on @lexical/utils for
# objectKlassEquals, which a Rust enum stands for.
plain-text = ["clipboard"]
# @lexical/clipboard: copy and paste (clipboard.ts and
# ClipboardImportExtension.ts), as JSON and plain text, as HTML when `html` is
# on too, and with GetClipboardDataExtension, ClipboardImportExtension and
# ClipboardDOMImportExtension when `extension` is. Upstream it depends on
# @lexical/extension and @lexical/html.
clipboard = ["selection", "utils"]
# @lexical/list: ListNode, ListItemNode, registerList and the model parts of
# registerCheckList, with the DOM parts when `html` is on too. Upstream it also
# depends on @lexical/extension, for ListExtension, which isn't ported.
list = ["utils"]
# @lexical/table: TableNode, TableRowNode, TableCellNode, TableSelection, the
# table map utilities, INSERT_TABLE_COMMAND and the model parts of the table
# handlers (Tab and arrow navigation on the table map), with the DOM parts
# when `html` is on too and TableExtension when `extension` is.
table = ["utils"]
# @lexical/link: LinkNode, AutoLinkNode, $toggleLink and registerLink, with the
# DOM parts when `html` is on too. Upstream it also depends on
# @lexical/extension, for LinkExtension, which isn't ported.
link = ["utils"]
# @lexical/link's registerAutoLink and its matchers (LexicalAutoLinkExtension.ts),
# whose regular expressions need the `regex` crate: the one feature with a
# third-party dependency (rust/DESIGN.md, "Architecture").
autolink = ["link", "dep:regex"]
# @lexical/code-core: CodeNode, CodeHighlightNode, FlatStructureUtils and the
# model parts of CodeExtension and registerCodeIndentation, with the DOM parts
# when `html` is on too. Like upstream it depends on @lexical/utils, for the
# arrow-key handlers ($onEscapeUp, $onEscapeDown); upstream also depends on
# @lexical/extension, for the extensions, which `extension` brings.
code = ["utils"]
# The highlighting loop of @lexical/code-prism (CodeHighlighterPrism.ts:
# registerCodeHighlighting, registerHighlightingOnly, and with `extension`
# CodePrismExtension), with the lazy languages of @lexical/code-shiki, over a
# Tokenizer the app supplies. Upstream it depends on @lexical/code-core,
# @lexical/extension and prismjs; Prism's grammars (a third-party
# dependency, as Swift's tree-sitter tokenizer would be) aren't ported, nor
# is registerCodeGutter, which writes to the DOM.
code-highlight = ["code"]
# @lexical/mark: MarkNode, $wrapSelectionInMarkNode, $unwrapMarkNode,
# $getMarkIDs, and the functions of MarkStateExtension.ts; with `extension`,
# MarkExtension, MarkStateExtension, MarkBaseExtension and the flavors of
# defineMarkExtension, and with `html` too their HTML export and import of the
# ids. Upstream it depends on @lexical/utils, which it enables as upstream does
# (nothing ported uses it yet), and on @lexical/extension and @lexical/html,
# which it uses when those features are on; the renderer's $decorateMarkIDs and
# isMarkIDShown need a reconciled DOM and aren't ported.
mark = ["utils"]
# @lexical/overflow: OverflowNode; with @lexical/react's character limit
# (shared/useCharacterLimit.ts), which wraps the text past a limit in overflow
# nodes. That needs @lexical/text ($rootTextContent) and @lexical/utils
# ($dfsWithSlots, $unwrapNode), as upstream's @lexical/react does, and splits
# text between grapheme clusters with tables generated from Unicode's data
# (rust/scripts/generate-grapheme-tables.mjs), without a dependency.
overflow = ["text", "utils"]
# @lexical/text: registerLexicalTextEntity, the transforms that make text
# entities (hashtags) of the text a matcher finds, and the root helpers
# ($rootTextContent, $isRootTextContentEmpty, $canShowPlaceholder,
# $findTextIntersectionFromCharacters).
text = []
# @lexical/hashtag: HashtagNode, its matcher (getHashtagMatch, without the
# `regex` crate) and registerLexicalHashtag. Upstream it also depends on
# @lexical/extension and @lexical/utils, for HashtagExtension and
# mergeRegister, which aren't ported.
hashtag = ["text"]
# @lexical/file: the .lexical document format, importFile and exportFile, with
# the app picking and saving the file.
file = []
# @lexical/devtools-core: generateContent, the tree view's text. Upstream it
# depends on @lexical/html, @lexical/link, @lexical/mark and @lexical/table;
# its HTML form is built with `html`, and its link, mark and table branches
# with `link`, `mark` and `table` (without them no such node or selection can
# exist).
devtools = []
# @lexical/extension: the extension API (buildEditorFromExtensions, with
# lexical's extension-core types and a port of @preact/signals-core), its
# model-level extensions with NormalizeInlineElementsExtension's transform,
# and its decorators, HorizontalRuleNode (a block decorator) and
# DecoratorTextNode (an inline one). Upstream it depends on @lexical/utils, for
# TabIndentationExtension's $handleIndentAndOutdent and
# HorizontalRuleExtension's $insertNodeToNearestRoot. With another package's
# feature, that package's extensions (RichTextExtension, HistoryExtension...).
extension = ["utils"]
# @lexical/html: a DOM in place of the browser's (`dom`: nodes, an HTML
# parser and serializer, and an inline style declaration that normalizes as
# jsdom's does), with the nodes' DOM hooks and HTML export and import.
html = ["selection"]
# @lexical/a11y's announcements: the live region model (LiveRegion, shown by
# the app's LiveRegionHost), AriaLiveRegionExtension, HistoryAnnounceExtension
# and EditorModeAnnounceExtension; with `rich-text`, @lexical/rich-text's
# HeadingAnnounceExtension, and with `link`, @lexical/link's
# AutoLinkAnnounceExtension. Upstream it depends on @lexical/extension and
# @lexical/utils. The focus trap, roving tabindex and focus manager move DOM
# focus, and aren't ported.
a11y = ["extension", "utils"]
# @lexical/react's DecoratorBlockNode (LexicalDecoratorBlockNode.ts). Upstream
# @lexical/react depends on most packages, for its other modules; the node
# needs none of them.
decorator-block = []
# The text matching of @lexical/react's typeahead menu
# (LexicalTypeaheadMenuPluginUtils.ts and the platform-neutral parts of
# shared/LexicalMenu.tsx and LexicalTypeaheadMenuPlugin.tsx): the trigger
# match (without the `regex` crate), $splitNodeContainingQuery, the text
# before the caret, and the menu's state, option selection and keyboard
# commands.
menu = []
# @lexical/react's auto-embed (LexicalAutoEmbedPluginUtils.ts and the logic of
# LexicalAutoEmbedPlugin.tsx): URL_MATCHER (without the `regex` crate),
# EmbedConfig, INSERT_EMBED_COMMAND and registerAutoEmbed, which opens a node
# menu at a pasted link. It needs @lexical/link, the menu and @lexical/utils,
# as upstream's imports do.
auto-embed = ["link", "menu", "utils"]
# @lexical/markdown: import, export, the transformers and the shortcuts
# (registerMarkdownShortcuts), with a JS RegExp engine of its own (no `regex`).
markdown = ["rich-text", "list", "link", "code"]

[dependencies]
# Without `perf-literal`, which would add aho-corasick and memchr.
regex = { version = "1.13", optional = true, default-features = false, features = [
    "std",
    "unicode",
    "perf-backtrack",
    "perf-cache",
    "perf-dfa",
    "perf-inline",
    "perf-onepass",
] }

[lints]
workspace = true
